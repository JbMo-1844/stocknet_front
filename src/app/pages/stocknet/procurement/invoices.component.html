<div class="space-y-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-emerald-600">Invoices</p>
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">Invoice verification</h1>
      </div>
      <button type="button" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white">Upload invoice</button>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900">
    <div class="overflow-x-auto">
      <table class="min-w-full text-left text-sm">
        <thead class="text-gray-500">
          <tr>
            <th class="py-2">Invoice</th>
            <th class="py-2">Supplier</th>
            <th class="py-2">Amount</th>
            <th class="py-2">Status</th>
          </tr>
        </thead>
        <tbody>
          @for (invoice of invoices; track invoice.id) {
          <tr class="border-t border-gray-100 dark:border-gray-800">
            <td class="py-3 text-gray-700 dark:text-gray-200">{{ invoice.id }}</td>
            <td class="py-3 text-gray-700 dark:text-gray-200">{{ invoice.supplier }}</td>
            <td class="py-3 text-gray-700 dark:text-gray-200">GHS {{ invoice.amount }}</td>
            <td class="py-3"><span class="rounded-full px-2.5 py-1 text-xs font-medium bg-slate-50 text-slate-700 dark:bg-slate-500/10 dark:text-slate-300">{{ invoice.status }}</span></td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
