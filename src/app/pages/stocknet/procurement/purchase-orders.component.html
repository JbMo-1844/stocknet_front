<div class="space-y-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-emerald-600">Purchase Orders</p>
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">Purchase order management</h1>
      </div>
      <button type="button" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-medium text-white">Generate order</button>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-900">
    <div class="overflow-x-auto">
      <table class="min-w-full text-left text-sm">
        <thead class="text-gray-500">
          <tr>
            <th class="py-2">Order</th>
            <th class="py-2">Supplier</th>
            <th class="py-2">Total</th>
            <th class="py-2">Status</th>
            <th class="py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (order of orders; track order.id) {
          <tr class="border-t border-gray-100 dark:border-gray-800">
            <td class="py-3 text-gray-700 dark:text-gray-200">{{ order.id }}</td>
            <td class="py-3 text-gray-700 dark:text-gray-200">{{ order.supplier }}</td>
            <td class="py-3 text-gray-700 dark:text-gray-200">GHS {{ order.total }}</td>
            <td class="py-3"><span class="rounded-full px-2.5 py-1 text-xs font-medium bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300">{{ order.status }}</span></td>
            <td class="py-3 space-x-2"><button class="rounded-xl border border-gray-200 px-3 py-2 text-xs font-semibold text-gray-700 dark:border-gray-700 dark:text-gray-200">View</button></td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
