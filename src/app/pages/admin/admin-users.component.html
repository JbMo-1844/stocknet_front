<div class="space-y-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">User management</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">Create, update, and remove system users.</p>
      </div>
    </div>

    @if (notification) {
      <div class="mb-4 rounded-lg border px-4 py-3 text-sm" [class.border-green-200]="notification.type === 'success'" [class.bg-green-50]="notification.type === 'success'" [class.text-green-700]="notification.type === 'success'" [class.border-red-200]="notification.type === 'error'" [class.bg-red-50]="notification.type === 'error'" [class.text-red-700]="notification.type === 'error'">
        {{ notification.message }}
      </div>
    }

    <form (ngSubmit)="submit()" class="grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
        <input [(ngModel)]="form.name" name="name" class="w-full rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
        <input [(ngModel)]="form.email" name="email" class="w-full rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Role</label>
        <select [(ngModel)]="form.role" name="role" class="w-full rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          <option value="admin">Admin</option>
          <option value="procurement-officer">Procurement Officer</option>
          <option value="storekeeper">Storekeeper</option>
          <option value="stock-keeper">Stock Keeper</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
        <input [(ngModel)]="form.password" name="password" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
      </div>
      <div class="md:col-span-2 flex gap-3">
        <button type="submit" class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600">
          {{ isSubmitting ? 'Saving...' : (editingId ? 'Update user' : 'Create user') }}
        </button>
        <button type="button" (click)="resetForm()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 dark:border-gray-700 dark:text-gray-300">
          Clear
        </button>
      </div>
    </form>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Existing users</h3>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-800">
        <thead>
          <tr class="text-left text-gray-600 dark:text-gray-400">
            <th class="px-3 py-2">Name</th>
            <th class="px-3 py-2">Email</th>
            <th class="px-3 py-2">Role</th>
            <th class="px-3 py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user.id) {
            <tr class="border-b border-gray-100 dark:border-gray-800">
              <td class="px-3 py-3">{{ user.name }}</td>
              <td class="px-3 py-3">{{ user.email }}</td>
              <td class="px-3 py-3">{{ user.role }}</td>
              <td class="px-3 py-3">
                <button type="button" (click)="editUser(user)" class="mr-2 text-sm font-semibold text-brand-500">Edit</button>
                <button type="button" (click)="deleteUser(user.id)" class="text-sm font-semibold text-red-500">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
