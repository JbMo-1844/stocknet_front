<div class="relative p-6 bg-white z-1 dark:bg-gray-950 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row sm:p-0"
  >
    <ng-content></ng-content>

    <!-- Left Branding Panel -->
    <div
      class="relative hidden lg:flex w-1/2 h-full items-center justify-center overflow-hidden bg-gradient-to-br from-[#ffffff] via-[#f8fafc] to-[#eef6ff]"
    >
      <!-- Decorative Background -->
      <div class="absolute inset-0 opacity-10">
        <app-grid-shape></app-grid-shape>
      </div>

      <!-- Soft Background Circles -->
      <div
        class="absolute w-96 h-96 rounded-full bg-blue-100 blur-3xl -top-24 -left-24 opacity-60"
      ></div>

      <div
        class="absolute w-80 h-80 rounded-full bg-yellow-100 blur-3xl -bottom-20 -right-20 opacity-50"
      ></div>

      <!-- Branding -->
      <div class="relative z-10 flex flex-col items-center px-12 text-center">

        <!-- Logo -->
        <a routerLink="/" class="mb-8">
          <img
            src="images/icons/fiveicon.png"
            alt="CampStock"
            class="w-56 drop-shadow-xl transition-transform duration-300 hover:scale-105"
          />
        </a>

        <!-- Title -->
        <h1 class="text-5xl font-extrabold tracking-tight text-slate-900">
          CampStock
        </h1>

        <!-- Subtitle -->
        <p class="mt-3 text-xl font-semibold text-blue-700">
          Lucky Summer SDA Camp
        </p>

        <!-- Description -->
        <p class="max-w-lg mt-6 text-lg leading-8 text-slate-600">
          Smart Inventory, Procurement & Menu Management System designed to
          simplify inventory tracking, procurement, menu planning, and stock
          management through an intuitive and modern digital experience.
        </p>

        <!-- Divider -->
        <div class="w-24 h-1 mt-8 rounded-full bg-gradient-to-r from-blue-600 via-yellow-400 to-green-600"></div>

        <!-- Motto -->
        <p class="mt-6 text-sm font-medium tracking-[0.3em] uppercase text-slate-500">
          Stewardship • Accountability • Excellence
        </p>
      </div>
    </div>

    <!-- Theme Toggle -->
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
